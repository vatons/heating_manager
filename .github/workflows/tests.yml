name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Home Assistant 2026.10, as pinned in requirements_test.txt (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 .venv && uv pip install --python .venv/bin/python -r requirements_test.txt
      - run: .venv/bin/pytest
