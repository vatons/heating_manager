# Services for Heating Manager

set_boost:
  name: Set Boost
  description: Boost rooms for a while, above their schedule. Target a zone or the whole house to boost each of its rooms that has temperature sensors
  target:
    entity:
      integration: heating_manager
      domain: climate
  fields:
    duration:
      name: Duration
      description: Duration of boost in minutes (default is the room's boost duration)
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: minutes
    temperature:
      name: Temperature
      description: Target temperature during boost, in your unit system, from 5 to 30 °C (41 to 86 °F). Default is the room's current target, or its current temperature if higher, + 2°C
      required: false
      example: 22
      selector:
        number:
          mode: box
          step: 0.5

clear_boost:
  name: Clear Boost
  description: End the boost in rooms (target a zone or the whole house to end it in all of their rooms)
  target:
    entity:
      integration: heating_manager
      domain: climate

skip_to_next:
  name: Skip to next
  description: Go to the next scheduled temperature now, until that change comes, when the schedule carries on. Ends the boost; on a zone, also its rooms' own manual temperatures and boosts. Target the whole house to skip every zone. Not in away mode
  target:
    entity:
      integration: heating_manager
      domain: climate

set_mode:
  name: Set Mode
  description: Set the heating mode (schedule or away)
  fields:
    mode:
      name: Mode
      description: The heating mode to set
      required: true
      example: "schedule"
      selector:
        select:
          options:
            - label: "Schedule"
              value: "schedule"
            - label: "Away"
              value: "away"
